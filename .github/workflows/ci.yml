name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  downloads:
    name: ZIP игры и мобильных песочниц актуальны
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python3 tools/package-downloads.py --check

  ios:
    name: iOS — компиляция и тесты в симуляторе
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: python3 tools/check-ios.py

  android:
    name: Android — компиляция, тесты и lint без APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Проверить песочницу
        working-directory: android-sandbox
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon

  tests:
    name: Тесты (npm test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The project has no dependencies, so there is nothing to install.
      - run: npm test

  content:
    name: Сцены проходимы (check:content)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:content

  first-screen:
    name: Первый экран ≤ 3 с
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:budget

  weight:
    name: Вес игры ≤ 5 МБ
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Размер папки game
        run: |
          bytes=$(du -sb game | cut -f1)
          echo "Папка game: $((bytes / 1024)) КБ (бюджет хакатона 5 МБ)"
          echo "### Вес игры: $((bytes / 1024)) КБ из 5120 КБ" >> "$GITHUB_STEP_SUMMARY"
          test "$bytes" -le $((5 * 1024 * 1024))
